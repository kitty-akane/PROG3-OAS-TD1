openapi: 3.0.3
 
info:
  title: Restaurant Ingredients API
  description: REST API for managing ingredients and dishes
  version: 1.0.0
 
servers:
  - url: http://localhost:8080
    description: Local server
 
tags:
  - name: Ingredients
    description: Operations about ingredients
  - name: Dishes
    description: Operations about dishes
components:
    parameters:
    IngredientId:
      name: id
      in: path
      required: true
      description: Unique identifier of the ingredient.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 1
        schemas:
    Category:
      type: string
      description: Category of the ingredient.
      enum: [VEGETABLE, ANIMAL, MARINE, DAIRY, OTHER]
      example: VEGETABLE
          Unit:
      type: string
      description: Unit of measurement for stock quantities.
      enum: [PCS, KG, L]
      example: KG
 
    DishType:
      type: string
      description: Type/course of the dish.
      enum: [STARTER, MAIN, DESSERT]
      example: MAIN
        Ingredient:
      type: object
      required:
        - id
        - name
        - category
        - price
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier of the ingredient.
          example: 1
        name:
          type: string
          description: Name of the ingredient.
          example: "Tomato"
        category:
          $ref: '#/components/schemas/Category'
        price:
          type: number
          format: double
          description: Unit price of the ingredient.
          example: 2.50
              StockValue:
      type: object
      required:
        - quantity
        - unit
      properties:
        quantity:
          type: number
          format: double
          description: Computed stock quantity at the requested datetime.
          example: 12.5
        unit:
          $ref: '#/components/schemas/Unit'
 
    DishIngredientRest:
      type: object
      description: Flattened ingredient representation as returned inside a dish response.
      required:
        - id
        - name
        - category
        - price
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier of the ingredient.
          example: 1
        name:
          type: string
          description: Name of the ingredient.
          example: "Tomato"
        category:
          $ref: '#/components/schemas/Category'
        price:
          type: number
          format: double
          description: Unit price of the ingredient.
          example: 2.50
 
    DishRest:
      type: object
      required:
        - id
        - name
        - dishIngredients
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier of the dish.
          example: 1
        name:
          type: string
          description: Name of the dish.
          example: "Ratatouille"
        price:
          type: number
          format: double
          description: Selling price of the dish.
          example: 12.99
        dishIngredients:
          type: array
          description: List of ingredients used in this dish.
          items:
            $ref: '#/components/schemas/DishIngredientRest'
 
    ErrorResponse:
      type: string
      description: Plain text error message returned on 4xx/5xx responses.
      example: "Ingredient.id=1 is not found"
paths:
  /ingredients:
    Get:
      tags:
        - Ingredients
      summary: Get all ingredients
            description: Returns the full list of ingredients without their stock movements.
      operationId: getIngredients
      responses:
        '200':
          description: List of all ingredients.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
              example:
                - id: 1
                  name: "Tomato"
                  category: VEGETABLE
                  price: 2.50
                - id: 2
                  name: "Chicken"
                  category: ANIMAL
                  price: 8.00
        '400':
          description: Bad request.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'